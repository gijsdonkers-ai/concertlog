<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Gijs' Concertlog</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Concertlog">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0f'/%3E%3Ctext y='.9em' font-size='70' x='10'%3E%26%23x26A1%3B%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body.theme-dark{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--accent:#e8ff47;--accent2:#ff4d6d;--accent3:#47c5ff;--text:#f0ede8;--muted:#777;--border:rgba(255,255,255,0.08);--card:#14141e;--nav-bg:rgba(10,10,15,0.97)}
body.theme-midnight{--bg:#07080f;--bg2:#0d1020;--bg3:#141828;--accent:#a78bfa;--accent2:#f472b6;--accent3:#38bdf8;--text:#e2e8f0;--muted:#64748b;--border:rgba(167,139,250,0.12);--card:#0d1020;--nav-bg:rgba(7,8,15,0.97)}
body.theme-ember{--bg:#0f0a07;--bg2:#1a1008;--bg3:#261808;--accent:#fb923c;--accent2:#f43f5e;--accent3:#fbbf24;--text:#fef3c7;--muted:#78716c;--border:rgba(251,146,60,0.12);--card:#1a1008;--nav-bg:rgba(15,10,7,0.97)}
body.theme-neon{--bg:#020b12;--bg2:#041520;--bg3:#071e2c;--accent:#00f5d4;--accent2:#f706cf;--accent3:#fee440;--text:#e0f7fa;--muted:#4dd0e1;--border:rgba(0,245,212,0.1);--card:#041520;--nav-bg:rgba(2,11,18,0.97)}
body.theme-chalk{--bg:#f5f0eb;--bg2:#ede8e3;--bg3:#e0dad4;--accent:#1a1a2e;--accent2:#c84b31;--accent3:#2d6a4f;--text:#1a1a2e;--muted:#6b6560;--border:rgba(26,26,46,0.12);--card:#ede8e3;--nav-bg:rgba(245,240,235,0.97)}
body.theme-ys-dark{--bg:#0f1e25;--bg2:#1a313b;--bg3:#233d49;--accent:#FDC300;--accent2:#ff6b35;--accent3:#E5A100;--text:#f0ece2;--muted:#748595;--border:rgba(253,195,0,0.15);--card:#1a313b;--nav-bg:rgba(15,30,37,0.97)}
body.theme-ys-night{--bg:#080f12;--bg2:#111e24;--bg3:#182830;--accent:#FDC300;--accent2:#d49600;--accent3:#f0ece2;--text:#e8e4d8;--muted:#748595;--border:rgba(253,195,0,0.12);--card:#111e24;--nav-bg:rgba(8,15,18,0.97)}
body.theme-ys-petrol{--bg:#1a2830;--bg2:#233240;--bg3:#2d3e4e;--accent:#FDC300;--accent2:#E5A100;--accent3:#96b8c8;--text:#ddeaf0;--muted:#748595;--border:rgba(253,195,0,0.14);--card:#233240;--nav-bg:rgba(26,40,48,0.97)}
body.theme-ys-slate{--bg:#1e2c38;--bg2:#273848;--bg3:#374e5c;--accent:#FDC300;--accent2:#E5A100;--accent3:#a8bfcc;--text:#e4eef4;--muted:#8fa4b4;--border:rgba(253,195,0,0.13);--card:#273848;--nav-bg:rgba(30,44,56,0.97)}
body.theme-ys-light{--bg:#f7f4ee;--bg2:#eeeae0;--bg3:#e3ddd0;--accent:#1a313b;--accent2:#d49600;--accent3:#374e5c;--text:#1a313b;--muted:#748595;--border:rgba(26,49,59,0.14);--card:#eeeae0;--nav-bg:rgba(247,244,238,0.97)}
body.theme-arctic{--bg:#f0f6fc;--bg2:#e8f0f8;--bg3:#dde8f4;--accent:#0d2240;--accent2:#0099cc;--accent3:#c84b31;--text:#0d1b2a;--muted:#5a7a94;--border:rgba(13,34,64,0.14);--card:#e8f0f8;--nav-bg:rgba(240,246,252,0.97)}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;transition:background .3s}
nav{background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;display:flex;flex-direction:column}
.nav-safe{height:env(safe-area-inset-top);background:var(--nav-bg)}
.nav-inner{display:flex;align-items:center;padding:0 12px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));overflow-x:auto;width:100%}
.logo{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1.5px;color:var(--accent);padding:12px 0;margin-right:12px;flex-shrink:0;white-space:nowrap}
.ntab{padding:13px 10px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:color .2s,border-color .2s}
.ntab:hover{color:var(--text)}.ntab.on{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));max-width:960px;margin:0 auto;width:100%}
h1{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;margin-bottom:14px;color:var(--text)}
.btn{padding:9px 16px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.b-pri{background:var(--accent);color:var(--bg)}.b-pri:hover{filter:brightness(1.1)}
.b-sec{background:var(--bg3);color:var(--text);border:1px solid var(--border)}.b-sec:hover{border-color:var(--accent)}
.b-del{background:rgba(255,77,109,.12);color:var(--accent2);border:1px solid rgba(255,77,109,.2)}.b-del:hover{background:rgba(255,77,109,.22)}
.b-warn{background:rgba(255,77,109,.9);color:#fff}.b-warn:hover{background:var(--accent2)}
.b-gist{background:rgba(71,197,255,.12);color:var(--accent3);border:1px solid rgba(71,197,255,.2)}.b-gist:hover{background:rgba(71,197,255,.22)}
.b-sm{padding:5px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;width:100%;transition:border-color .2s}@media(min-width:640px){input,select,textarea{font-size:13px}}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted)}
select option{background:var(--bg2)}
.sw{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:nowrap;width:100%}
.sw select,.sw .si{box-sizing:border-box}
.sw select{padding:9px 6px;font-size:13px}
@media(max-width:639px){
  .sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .sw-search{grid-column:1 / 7;grid-row:1}
  .sw-locatie{grid-column:1 / 4;grid-row:2}
  .sw-plaats{grid-column:4 / 7;grid-row:2}
  .sw-jaar{grid-column:1 / 3;grid-row:3}
  .sw-maand{grid-column:3 / 5;grid-row:3}
  .sw-soort{grid-column:5 / 7;grid-row:3}
  .sw select,.sw .si{width:100%;min-width:0!important}
}
.si{position:relative}.si input{padding-left:30px}
.sicon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:13px}
.grid{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:border-color .2s;cursor:pointer}
.card:hover{border-color:rgba(232,255,71,.25)}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.cartist{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.3px;line-height:1.1;color:var(--text)}
.cdate{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500}
.p-soort{background:rgba(71,197,255,.12);color:var(--accent3)}
.p-fest{background:rgba(255,160,50,.12);color:#ffa032}
.p-sl{background:rgba(255,77,109,.12);color:var(--accent2)}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.fg{display:flex;flex-direction:column;gap:5px}
label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.hint{font-size:11px;color:var(--muted);margin-top:2px}
.divr{height:1px;background:var(--border);margin:14px 0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}
.tag:hover{border-color:var(--accent);color:var(--accent)}
.schip{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;display:flex;align-items:center;gap:5px}
.snum{color:var(--accent);font-size:10px;font-weight:600;min-width:16px}
.srem{color:var(--muted);cursor:pointer;background:none;border:none;font-size:14px;padding:0;line-height:1;font-family:'DM Sans',sans-serif}
.srem:hover{color:var(--accent2)}
.sgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.stl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stv{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);line-height:1}
.sts{font-size:10px;color:var(--muted);margin-top:2px}
.cbox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
.clbl{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bname{font-size:12px;min-width:90px;width:140px;flex-shrink:0;word-break:break-word;color:var(--text);line-height:1.3}
.btrack{flex:1;height:7px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bfill{height:100%;background:var(--accent);border-radius:4px}
.bcnt{font-size:12px;font-weight:600;color:var(--accent);min-width:24px;text-align:right}
.ybars{display:flex;align-items:flex-end;gap:3px;height:160px;overflow-x:auto;overflow-y:visible;padding-top:20px;box-sizing:content-box}
.ycol{display:flex;flex-direction:column;align-items:center;min-width:26px;flex:1}
.ybar{background:var(--accent);border-radius:3px 3px 0 0;width:100%;min-height:2px;margin-top:auto;flex-shrink:0}
.ylbl{font-size:9px;color:var(--muted);text-align:center;flex-shrink:0}.ycnt{font-size:10px;color:var(--accent);font-weight:600;text-align:center;white-space:nowrap;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:540px){.two{grid-template-columns:1fr}}
.dz{background:var(--card);border:2px dashed var(--border);border-radius:14px;padding:28px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:14px}
.dz:hover{border-color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;transition:transform .3s;z-index:999;pointer-events:none;white-space:nowrap;color:var(--text)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--accent);color:var(--accent)}
.toast.err{border-color:var(--accent2);color:var(--accent2)}
.toast.info{border-color:var(--accent3);color:var(--accent3)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.emtitle{font-family:'Bebas Neue',sans-serif;font-size:22px;margin-bottom:6px;color:var(--text)}
.pag{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.pinfo{font-size:12px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:14px;height:14px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
.tswatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .2s;flex-shrink:0}
.tswatch:hover{transform:scale(1.15)}.tswatch.active{border-color:var(--text)}
.paste-area{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;width:100%;min-height:80px;resize:vertical}
.paste-area:focus{outline:none;border-color:var(--accent)}
.paste-area::placeholder{color:var(--muted)}
.danger-zone{border:1px solid rgba(255,77,109,.3);border-radius:12px;padding:16px;margin-top:14px}
.danger-title{font-size:11px;font-weight:500;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500;border:1px solid var(--border);background:var(--bg3);color:var(--muted)}
.sync-ok{background:rgba(71,197,255,.12);color:var(--accent3);border-color:rgba(71,197,255,.2)}
.sync-err{background:rgba(255,77,109,.12);color:var(--accent2);border-color:rgba(255,77,109,.2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;max-width:680px;width:100%;max-height:85vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:20px 20px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;color:var(--text);line-height:1.1}
.modal-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.modal-close{background:var(--bg3);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:18px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.modal-close:hover{color:var(--text);border-color:var(--accent)}
.modal-body{overflow-y:auto;padding:16px 20px 32px;flex:1}
.modal-actions{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0}
.setlist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.setlist-item:last-child{border-bottom:none}
.setlist-num{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);min-width:28px;text-align:right}
.setlist-name{color:var(--text)}

.ybtn{padding:3px 9px;border-radius:12px;border:1px solid var(--border);background:transparent;font-size:10px;cursor:pointer;font-family:DM Sans,sans-serif;color:var(--muted);transition:all .15s;white-space:nowrap}
.ybtn.ybtn-on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:500}
.ybtn:hover{border-color:var(--accent)}
.ybar.ystacked{display:flex;flex-direction:column-reverse;overflow:hidden}
.yseg{width:100%;flex-shrink:0}
.ybars{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:4px 0 2px}
.ycol{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:28px;flex:1}
.ybar{background:var(--accent);border-radius:3px 3px 0 0;width:100%;min-height:3px}
.ylbl{font-size:9px;color:var(--muted);margin-top:1px}
.ycnt{font-size:10px;color:var(--accent);font-weight:600;white-space:nowrap}
.chat-box{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-top:14px;display:flex;flex-direction:column;overflow:hidden}
.chat-msgs{padding:16px;display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto}
.chat-msg{display:flex;gap:8px;align-items:flex-start}
.chat-msg.user{flex-direction:row-reverse}
.chat-bubble{padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.6;max-width:85%}
.chat-msg.bot .chat-bubble{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:4px 14px 14px 14px}
.chat-msg.user .chat-bubble{background:var(--accent);color:var(--bg);border-radius:14px 4px 14px 14px}
.chat-msg.thinking .chat-bubble{color:var(--muted)}
.chat-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.chat-bot-avatar{background:var(--bg3);border:1px solid var(--border)}
.chat-user-avatar{background:var(--accent);color:var(--bg)}
.chat-input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:22px;padding:9px 16px;color:var(--text);font-family:DM Sans,sans-serif;font-size:13px;resize:none}
.chat-input:focus{outline:none;border-color:var(--accent)}
.chat-send{width:38px;height:38px;border-radius:50%;border:none;background:var(--accent);color:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:filter .15s}
.chat-send:hover{filter:brightness(1.1)}.chat-send:disabled{opacity:.4;cursor:not-allowed}
.chat-suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.chat-sug{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--muted);cursor:pointer;font-family:DM Sans,sans-serif;transition:all .15s}
.chat-sug:hover{border-color:var(--accent);color:var(--accent)}
#factDisplay{transition:opacity .15s;min-height:40px}

.locked #tab-add { display: none; }
.locked #tab-sync { display: none; }
.otd-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;transition:border-color .2s}
.otd-card:hover{border-color:var(--accent)}
.schip{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:4px 8px;font-size:12px;cursor:default}
.sdrag{cursor:grab;color:var(--muted);font-size:14px;padding:0 2px;user-select:none}
.schip.drag-over{border-color:var(--accent);background:var(--bg2)}
.logo-short{display:none}.logo-full{display:inline}
@media(max-width:639px){.logo-short{display:inline}.logo-full{display:none}}
.p-top{background:rgba(253,195,0,.15);color:var(--accent)}
.toprow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.toprow:last-child{border-bottom:none}
.toppos{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--accent);min-width:34px;text-align:right}
</style>
</head>
<body class="theme-dark">
<nav>
  <div class="nav-safe"></div>
  <div style="display:flex;align-items:stretch;width:100%">
    <div class="nav-inner" style="flex:1;min-width:0">
      <div class="logo"><span class="logo-full">Gijs' Concertlog</span><span class="logo-short">GCL</span></div>
      <button class="ntab on" id="tab-list"      onclick="goPage('list')">Concerten</button>
      <button class="ntab"    id="tab-add"       onclick="goPage('add')">+ Toevoegen</button>
      <button class="ntab"    id="tab-analytics" onclick="goPage('analytics')">Analytics</button>
      <button class="ntab"    id="tab-top"       onclick="goPage('top')">Top</button>
      <button class="ntab"    id="tab-upcoming"  onclick="goPage('upcoming')">Agenda</button>
      <button class="ntab"    id="tab-sync"      onclick="goPage('sync')">Admin</button>
    </div>
    <div style="display:flex;align-items:center;flex-shrink:0;border-left:1px solid var(--border)">
      <button id="nav-theme-btn" onclick="toggleDayNight()" title="Wissel thema" style="background:none;border:none;font-size:18px;cursor:pointer;padding:0 10px;color:var(--muted);height:100%">🌙</button>
      <button id="tab-lock" onclick="unlocked?lock():tryUnlock()" title="Vergrendelen/ontgrendelen" style="background:none;border:none;font-size:18px;cursor:pointer;padding:0 14px;color:var(--muted);height:100%">🔒</button>
    </div>
  </div>
</nav>
<div class="main" id="APP"></div>
<div class="toast" id="TOAST"></div>

<script>
// ── STATE ─────────────────────────────────────────────────────────
var DB = [];
var page = 'list';
var editId = null;
var upcomingDB = JSON.parse(localStorage.getItem('giglog_upcoming')||'[]');
// Aliases: { artiest: {canonical: [alias1, alias2]}, locatie: {canonical: [alias1, alias2]} }
var aliasesDB = JSON.parse(localStorage.getItem('giglog_aliases')||'{"artiest":{},"locatie":{}}');
function persistAliases(){
  try{ localStorage.setItem('giglog_aliases', JSON.stringify(aliasesDB)); }catch(e){}
  if(GIST_ID&&GIST_TOKEN) saveToGist();
}
// Alias → canonical
function canonical(kind, name){
  if(!name) return name;
  var map = aliasesDB[kind] || {};
  for(var canon in map){
    if(canon===name) return canon;
    if(map[canon] && map[canon].indexOf(name)>-1) return canon;
  }
  return name;
}
function persistUpcoming(){
  try{ localStorage.setItem('giglog_upcoming', JSON.stringify(upcomingDB)); }catch(e){}
  if(GIST_ID&&GIST_TOKEN) saveToGist();
}
var srchQ = '', fJaar = '', fMaand = '', fSoort = '', fPlaats = '', fLocatie = '';
var curPage = 1, PER = 50;
var FD = mkFD();
var curTheme = localStorage.getItem('giglog_theme') || 'ys-light';
var DEFAULT_PASS_HASH = '1tassqe'; // = 'siemensgsm'
var PASS_HASH = DEFAULT_PASS_HASH; // Altijd het ingebakken wachtwoord gebruiken
var unlocked  = sessionStorage.getItem('giglog_unlocked') === '1';
var DEFAULT_GIST_ID    = 'bb90b084d04ae698d6e25fad6bdb3796';
var DEFAULT_GIST_TOKEN = ''; // Vul je token in via Admin op jouw eigen apparaat
var GIST_ID    = localStorage.getItem('giglog_gist_id')    || DEFAULT_GIST_ID;
var GIST_TOKEN = localStorage.getItem('giglog_gist_token') || DEFAULT_GIST_TOKEN;
var GIST_FILE  = 'concertlog.json';
var gistStatus = 'none';
var ANTHROPIC_KEY = localStorage.getItem('giglog_anthropic_key') || '';
var _factIdx = 0;
var CAPI  = 'https://api.anthropic.com/v1/messages';

// ── TOP CONCERTEN ─────────────────────────────────────────────────
var topDB = {};
try{ topDB = JSON.parse(localStorage.getItem('giglog_top')||'{}'); }catch(e){ topDB = {}; }
var _topMap = null, _topTimer = null;
var TOP_CATS = {hp:'Hoofdprogramma / Voorprogramma', fest:'Festivaloptredens'};

function topCat(c){
  if(c.soort==='Hoofdprogramma'||c.soort==='Voorprogramma') return 'hp';
  if(c.soort==='Festivaloptreden') return 'fest';
  return null; // Theater/Comedy doet niet mee
}
function persistTop(skipGist){
  _topMap = null;
  try{ localStorage.setItem('giglog_top', JSON.stringify(topDB)); }catch(e){}
  if(skipGist || !(GIST_ID&&GIST_TOKEN)) return;
  clearTimeout(_topTimer);
  _topTimer = setTimeout(saveToGist, 1500);
}
function getTopMap(){
  if(_topMap) return _topMap;
  _topMap = {};
  Object.keys(topDB).forEach(function(y){
    ['hp','fest'].forEach(function(cat){
      ((topDB[y] && topDB[y][cat]) || []).forEach(function(id,i){
        _topMap[id] = {year:y, cat:cat, pos:i+1};
      });
    });
  });
  return _topMap;
}
function topBadge(id){
  var t = getTopMap()[id];
  if(!t) return '';
  return '<span class="pill p-top">#'+t.pos+' Top '+(t.cat==='fest'?'festivals ':'')+t.year+'</span>';
}
function topLabel(c){
  var d = c.datum ? c.datum.slice(8,10)+'-'+c.datum.slice(5,7) : '';
  return c.artiest+' | '+d+(c.locatie?' | '+c.locatie:'');
}
function topRemoveById(id){
  Object.keys(topDB).forEach(function(y){
    ['hp','fest'].forEach(function(cat){
      if(topDB[y][cat]) topDB[y][cat] = topDB[y][cat].filter(function(x){ return x!==id; });
    });
  });
  persistTop(true); // afterMutate() doet de Gist-upload
}
function addTopYear(){
  var sel = document.getElementById('topYearIn');
  if(!sel || !sel.value) return;
  if(!topDB[sel.value]) topDB[sel.value] = {hp:[], fest:[]};
  persistTop(); render();
}
function removeTopYear(y){
  var n = ((topDB[y].hp||[]).length)+((topDB[y].fest||[]).length);
  if(!confirm('Top-lijsten van '+y+' verwijderen ('+n+' concerten)? De concerten zelf blijven bestaan.')) return;
  delete topDB[y];
  persistTop(); render();
}
function topAdd(y, cat){
  var inp = document.getElementById('topIn_'+y+'_'+cat);
  if(!inp || !inp.value.trim()) return;
  var val = inp.value.trim();
  var c = DB.find(function(x){
    return String(x.jaar)===String(y) && topCat(x)===cat && !getTopMap()[x.id] && topLabel(x)===val;
  });
  if(!c){ toast('Kies een concert uit de lijst','err'); return; }
  if(!topDB[y][cat]) topDB[y][cat] = [];
  topDB[y][cat].push(c.id);
  persistTop(); render();
}
function topMove(y, cat, i, dir){
  var a = topDB[y][cat], j = i+dir;
  if(j<0 || j>=a.length) return;
  var t = a[i]; a[i] = a[j]; a[j] = t;
  persistTop(); render();
}
function topRemove(y, cat, i){
  topDB[y][cat].splice(i,1);
  persistTop(); render();
}

function buildTop(){
  var years = Object.keys(topDB).sort(function(a,b){ return b-a; });
  var html = '<h1>TOP CONCERTEN</h1>';
  if(unlocked){
    var avail = [...new Set(DB.map(function(c){return c.jaar;}).filter(Boolean))]
      .filter(function(y){ return !topDB[String(y)]; })
      .sort(function(a,b){ return b-a; });
    html += '<div class="cbox"><div class="clbl">Jaar toevoegen</div>'
      +'<div style="display:flex;gap:6px"><select id="topYearIn" style="flex:1;min-width:0">'
      +avail.map(function(y){ return '<option value="'+y+'">'+y+'</option>'; }).join('')
      +'</select><button class="btn b-pri b-sm" onclick="addTopYear()">+ Jaar</button></div></div>';
  }
  if(!years.length){
    html += '<div class="empty"><div class="emtitle">Nog geen top-lijsten</div></div>';
  }
  years.forEach(function(y){ html += buildTopYear(y); });
  return html;
}

function buildTopYear(y){
  var html = '<div class="cbox"><div style="display:flex;align-items:center;justify-content:space-between">'
    +'<div style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;color:var(--text)">'+escH(y)+'</div>'
    +(unlocked?'<button class="btn b-del b-sm" onclick="removeTopYear(\''+y+'\')">&#215; Jaar</button>':'')
    +'</div>';
  ['hp','fest'].forEach(function(cat){
    var ids = (topDB[y] && topDB[y][cat]) || [];
    html += '<div class="clbl" style="margin-top:14px">'+TOP_CATS[cat]+' ('+ids.length+')</div>';
    if(!ids.length) html += '<div style="color:var(--muted);font-size:13px;padding:4px 0">Nog geen concerten in deze lijst.</div>';
    ids.forEach(function(id, i){
      var c = DB.find(function(x){ return x.id===id; });
      var d = (c && c.datum) ? new Date(c.datum).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) : '';
      var loc = c ? (c.locatie ? escH(c.locatie)+(c.plaats?', '+escH(c.plaats):'') : escH(c.plaats||'')) : '';
      html += '<div class="toprow"><div class="toppos">'+(i+1)+'</div>'
        +(c
          ? '<div style="flex:1;min-width:0;cursor:pointer" onclick="openDetail(\''+id+'\')">'
            +'<div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;line-height:1.1;color:var(--text)">'+escH(c.artiest)+'</div>'
            +'<div style="font-size:12px;color:var(--muted)">'+escH(d)+(loc?' &middot; '+loc:'')+'</div></div>'
          : '<div style="flex:1;color:var(--muted);font-style:italic">Concert niet gevonden</div>')
        +(unlocked
          ? '<button class="btn b-sec b-sm"'+(i===0?' disabled':'')+' onclick="topMove(\''+y+'\',\''+cat+'\','+i+',-1)">&#8593;</button>'
            +'<button class="btn b-sec b-sm"'+(i===ids.length-1?' disabled':'')+' onclick="topMove(\''+y+'\',\''+cat+'\','+i+',1)">&#8595;</button>'
            +'<button class="btn b-del b-sm" onclick="topRemove(\''+y+'\',\''+cat+'\','+i+')">&#215;</button>'
          : '')
        +'</div>';
    });
    if(unlocked){
      var cands = DB.filter(function(c){
        return String(c.jaar)===String(y) && topCat(c)===cat && !getTopMap()[c.id];
      }).sort(function(a,b){ return a.datum>b.datum?1:-1; });
      var listId = 'topList_'+y+'_'+cat;
      html += '<div style="display:flex;gap:6px;margin-top:10px">'
        +'<input id="topIn_'+y+'_'+cat+'" list="'+listId+'" placeholder="Zoek concert om toe te voegen..." autocomplete="off" style="flex:1;min-width:0">'
        +'<datalist id="'+listId+'">'
        +cands.map(function(c){ return '<option value="'+escH(topLabel(c))+'"></option>'; }).join('')
        +'</datalist>'
        +'<button class="btn b-pri b-sm" onclick="topAdd(\''+y+'\',\''+cat+'\')">+</button></div>';
    }
  });
  return html + '</div>';
}

function hashStr(s){
  var h=5381;
  for(var i=0;i<s.length;i++) h=((h<<5)+h)^s.charCodeAt(i);
  return (h>>>0).toString(36);
}
function tryUnlock(){
  if(!PASS_HASH){
    unlocked=true; sessionStorage.setItem('giglog_unlocked','1'); render(); return;
  }
  var pw=prompt('Wachtwoord:');
  if(pw===null) return;
  if(hashStr(pw)===PASS_HASH){
    unlocked=true; sessionStorage.setItem('giglog_unlocked','1'); render(); toast('Ontgrendeld ✓','ok');
  } else { toast('Onjuist wachtwoord','err'); }
}
function lock(){
  unlocked=false; sessionStorage.removeItem('giglog_unlocked');
  if(page==='add'||page==='sync') goPage('list'); else render();
  toast('Vergrendeld','info');
}
function savePassword(){
  var el=document.getElementById('newPassIn'); if(!el) return;
  var pw=el.value.trim();
  if(!pw){ PASS_HASH=''; localStorage.removeItem('giglog_pass_hash'); toast('Wachtwoord verwijderd','info'); goPage('sync'); return; }
  PASS_HASH=hashStr(pw); localStorage.setItem('giglog_pass_hash',PASS_HASH);
  unlocked=true; sessionStorage.setItem('giglog_unlocked','1'); toast('Wachtwoord opgeslagen','ok'); goPage('sync');
}
function toggleDayNight(){
  var dark=['dark','ys-dark','ys-night','ys-petrol','ys-slate'];
  setTheme(dark.indexOf(curTheme)>-1 ? 'ys-light' : 'ys-dark');
}
function forcePush(){
  if(!GIST_ID||!GIST_TOKEN){ toast('Geen Gist ID of token','err'); return; }
  if(!confirm('Lokale data uploaden? Gist wordt overschreven.')) return;
  saveToGist(); toast('Geüpload naar Gist','ok');
}
function mkFD(){ return {artiest:'',locatie:'',plaats:'',datum:'',setlist:[],festival:'',soort:'Hoofdprogramma'}; }

// ── UTILS ─────────────────────────────────────────────────────────
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, type){
  var el = document.getElementById('TOAST');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className='toast'; }, 3000);
}

function setTheme(t){
  curTheme = t;
  document.body.className = 'theme-'+t+(unlocked?'':' locked');
  localStorage.setItem('giglog_theme', t);
  document.querySelectorAll('.tswatch').forEach(function(sw){
    sw.classList.toggle('active', sw.dataset.theme===t);
  });
  var tb=document.getElementById('nav-theme-btn');
  if(tb){ var dk=['dark','ys-dark','ys-night','ys-petrol','ys-slate'].indexOf(t)>-1; tb.textContent=dk?'☀️':'🌙'; tb.title=dk?'Naar licht thema':'Naar donker thema'; }
}

// ── DB ────────────────────────────────────────────────────────────
function initDB(){
  if(GIST_ID){
    // Geen verouderde lokale data tonen: wacht op de Gist om ID-verschillen te voorkomen
    loadFromGist();
  } else {
    // Geen Gist: gebruik de lokale cache
    try {
      var c = JSON.parse(localStorage.getItem('giglog_v4')||'[]');
      if(Array.isArray(c)){ DB = c; normalize(); }
    } catch(e){ console.error('initDB',e); DB=[]; }
  }
}

function normalize(){
  DB = DB.map(function(r){
    if(r.soort==='Theater'||r.soort==='Musical'||r.soort==='Comedy') r.soort='Theater/Comedy';
    return r;
  });
  // Dedupliceren op ID — laatste voorkomen blijft
  var seen = {};
  var deduped = [];
  for(var i = DB.length-1; i >= 0; i--){
    if(!seen[DB[i].id]){
      seen[DB[i].id] = true;
      deduped.unshift(DB[i]);
    }
  }
  if(deduped.length < DB.length){
    console.warn('Duplicates removed:', DB.length - deduped.length);
  }
  DB = deduped;
}

function persist(){ if(DB.length>0) localStorage.setItem('giglog_v4', JSON.stringify(DB)); }

// ── GIST ──────────────────────────────────────────────────────────
async function loadFromGist(){
  if(!GIST_ID) return;
  gistStatus='syncing'; updateSyncBadge();
  try {
    var r = await fetch('https://api.github.com/gists/'+GIST_ID, {headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var gist = await r.json();
    var file = gist.files && gist.files[GIST_FILE];
    if(!file) throw new Error('Bestand niet gevonden');
    var data = JSON.parse(file.content);
    var upFile = gist.files && gist.files['upcoming.json'];
    if(upFile){ try{ upcomingDB=JSON.parse(upFile.content); localStorage.setItem('giglog_upcoming', JSON.stringify(upcomingDB)); }catch(e){} }
    var aliasFile = gist.files && gist.files['aliases.json'];
    if(aliasFile){ try{ aliasesDB=JSON.parse(aliasFile.content); localStorage.setItem('giglog_aliases', JSON.stringify(aliasesDB)); }catch(e){} }
    var topFile = gist.files && gist.files['top.json'];
    if(topFile){ try{ topDB=JSON.parse(topFile.content); _topMap=null; localStorage.setItem('giglog_top', JSON.stringify(topDB)); }catch(e){} }
    if(Array.isArray(data)){
      DB = data;
      normalize();
      persist();
      gistStatus = 'ok';
      render();
    } else { gistStatus='ok'; }
    updateSyncBadge();
  } catch(e){ console.warn('Gist load:',e.message); gistStatus='err'; updateSyncBadge(); }
}

async function saveToGist(){
  if(!GIST_ID||!GIST_TOKEN){ toast('Voer eerst Gist ID en token in bij Admin','err'); return; }
  if(!DB.length){ console.warn('saveToGist: DB is leeg, niet opgeslagen'); return; }
  gistStatus='syncing'; updateSyncBadge();
  try {
    var body={files:{}};
    body.files[GIST_FILE]={content:JSON.stringify(DB)};
    body.files['upcoming.json']={content:JSON.stringify(upcomingDB)};
    body.files['aliases.json']={content:JSON.stringify(aliasesDB)};
    body.files['top.json']={content:JSON.stringify(topDB)};
    var r=await fetch('https://api.github.com/gists/'+GIST_ID,{
      method:'PATCH',
      headers:{'Authorization':'Bearer '+GIST_TOKEN,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!r.ok){ var e=await r.json(); throw new Error(e.message||'HTTP '+r.status); }
    gistStatus='ok'; updateSyncBadge(); toast('Opgeslagen naar Gist!','ok');
  } catch(e){ gistStatus='err'; updateSyncBadge(); toast('Gist fout: '+e.message,'err'); }
}

function updateSyncBadge(){
  var el = document.getElementById('syncBadge');
  if(!el) return;
  if(!GIST_ID){ el.className='sync-badge'; el.textContent='Geen Gist'; }
  else if(gistStatus==='ok'){ el.className='sync-badge sync-ok'; el.textContent='Gesynchroniseerd'; }
  else if(gistStatus==='syncing'){ el.className='sync-badge sync-ok'; el.textContent='Bezig...'; }
  else { el.className='sync-badge sync-err'; el.textContent='Gist fout'; }
}

function afterMutate(){ persist(); if(GIST_ID&&GIST_TOKEN) saveToGist(); }

// ── NAVIGATION ────────────────────────────────────────────────────
function goPage(p){
  if((p==='add'||p==='sync')&&!unlocked){tryUnlock();return;}
  page = p;
  if(p!=='add') editId=null;
  ['list','add','analytics','upcoming','top','sync'].forEach(function(id){
    var el=document.getElementById('tab-'+id); if(el) el.className='ntab'+(id===p?' on':'');
  });
  render();
}

function render(){
  document.body.classList.toggle('locked', !unlocked);
  var lb=document.getElementById('tab-lock'); if(lb) lb.textContent=unlocked?'🔓':'🔒';
  var tb=document.getElementById('nav-theme-btn');
  if(tb){ var dk=['dark','ys-dark','ys-night','ys-petrol','ys-slate'].indexOf(curTheme)>-1; tb.textContent=dk?'☀️':'🌙'; tb.title=dk?'Naar licht thema':'Naar donker thema'; }
  var el = document.getElementById('APP');
  if     (page==='list')      el.innerHTML = buildList();
  else if(page==='add'){ el.innerHTML = buildForm(); setTimeout(refreshSongArea, 0); }
  else if(page==='analytics') { buildAnalyticsPage(); }
  else if(page==='upcoming')   el.innerHTML = buildUpcoming();
  else if(page==='top')       el.innerHTML = buildTop();
  else if(page==='sync')      el.innerHTML = buildAdmin();
}

// ── SEARCH / FILTER ───────────────────────────────────────────────
function fuzzyMatch(q, t){
  if(!q) return true; if(!t) return false;
  var tl=t.toLowerCase(), ql=q.toLowerCase().trim();
  if(tl.includes(ql)) return true;
  return ql.split(/\s+/).filter(Boolean).every(function(w){ return tl.includes(w); });
}

function getFiltered(){
  return DB.filter(function(c){
    var q=srchQ.trim(), lq=fLocatie.trim();
    var mq=!q||[c.artiest,c.festival].some(function(v){ return fuzzyMatch(q,v); });
    return mq && (!lq||(fuzzyMatch(lq,c.locatie)||fuzzyMatch(lq,c.plaats))) && (!fJaar||String(c.jaar)===fJaar)
           && (!fMaand||String(c.maand)===fMaand)
           && (!fSoort||c.soort===fSoort) && (!fPlaats||c.plaats===fPlaats);
  }).sort(function(a,b){ return b.datum>a.datum?1:-1; });
}

// ── LIST ──────────────────────────────────────────────────────────
function buildList(){
  var jaren    = [...new Set(DB.map(function(c){return c.jaar;}).filter(Boolean))].sort(function(a,b){return b-a;});
  var plaatsen = [...new Set(DB.map(function(c){return c.plaats;}).filter(Boolean))].sort();
  var soorten  = ['Hoofdprogramma','Voorprogramma','Festivaloptreden','Theater/Comedy'];
  var badge    = '<span class="sync-badge" id="syncBadge">Geen Gist</span>';

  var html = '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">'
    + '<h1>CONCERTLOG <span style="font-size:14px;color:var(--muted);font-family:DM Sans,sans-serif" id="totalCount"></span></h1>'
    + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+(unlocked?badge+'<button class="btn b-pri b-sm" onclick="goPage(\'add\')">+ Toevoegen</button>':'')+'</div>'
    + '</div>'
    + '<div class="sw">'
    + '<div class="si sw-search" style="flex:1;min-width:160px"><span class="sicon">&#128269;</span><input id="searchInput" placeholder="Zoek..." value="'+escH(srchQ)+'" autocomplete="off"></div>'
    + '<div class="si sw-locatie" style="min-width:100px"><span class="sicon">&#128205;</span><input id="locInput" placeholder="Locatie/Festival..." value="'+escH(fLocatie)+'" autocomplete="off"></div>'
    + '<select id="plaatsSel" class="sw-plaats" style="width:auto;min-width:100px"><option value="">Alle plaatsen</option>'
    + plaatsen.map(function(p){ return '<option value="'+escH(p)+'"'+(fPlaats===p?' selected':'')+'>'+escH(p)+'</option>'; }).join('')+'</select>'
    + '<select id="jaarSel" class="sw-jaar" style="width:auto;min-width:80px"><option value="">Alle jaren</option>'
    + jaren.map(function(j){ return '<option value="'+j+'"'+(fJaar===String(j)?' selected':'')+'>'+j+'</option>'; }).join('')+'</select>'
    + '<select id="maandSel" class="sw-maand" style="width:auto;min-width:80px"><option value="">Alle maanden</option>'

    + '</select>'

function updateCards(){
  var filtered = getFiltered();
  var total = filtered.length;
  var pages = Math.max(1, Math.ceil(total/PER));
  if(curPage>pages) curPage=pages;
  var slice = filtered.slice((curPage-1)*PER, curPage*PER);

  var tc=document.getElementById('totalCount');
  var ri=document.getElementById('resultInfo');
  var cg=document.getElementById('cardGrid');
  var pd=document.getElementById('pagDiv');
  if(!cg) return;
  if(tc) tc.textContent = total.toLocaleString('nl')+' concerten';
  if(ri) ri.textContent = total+' resultaten \u00b7 pagina '+curPage+' van '+pages;
  cg.innerHTML = total===0
    ? '<div class="empty"><div style="font-size:36px;margin-bottom:10px">&#127928;</div><div class="emtitle">Geen resultaten</div></div>'
    : '';
  if(total > 0){
    var frag = document.createDocumentFragment();
    slice.forEach(function(rec){ frag.appendChild(buildCard(rec)); });
    cg.appendChild(frag);
  }
  if(pd) pd.innerHTML = pages>1
    ? '<button class="btn b-sec b-sm"'+(curPage===1?' disabled':'')+' onclick="curPage=Math.max(1,curPage-1);updateCards()">&larr; Vorige</button>'
      +'<span class="pinfo">'+curPage+' / '+pages+'</span>'
      +'<button class="btn b-sec b-sm"'+(curPage===pages?' disabled':'')+' onclick="curPage=Math.min('+pages+',curPage+1);updateCards()">Volgende &rarr;</button>'
    : '';
}

function buildCard(con){
  var d = con.datum ? new Date(con.datum).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}) : '';
  var songs = con.setlist||[];
  var el = document.createElement('div');
  el.className = 'card';
  el.dataset.cid = con.id;
  el.addEventListener('click', function(){ openDetail(this.dataset.cid); });
  el.innerHTML = '<div class="ctop"><div class="cartist">'+escH(con.artiest)+'</div><div class="cdate">'+d+'</div></div>'
    +'<div class="cmeta">'
    +(con.locatie?'<span>&#128205; '+escH(con.locatie)+(con.plaats?', '+escH(con.plaats):'')+' </span>':(con.plaats?'<span>&#128205; '+escH(con.plaats)+'</span>':''))

async function callAI(venue){
  var hint=document.getElementById('aiHint'), pEl=document.getElementById('fP');
  if(!pEl||pEl.value.trim()) return;
  if(hint) hint.textContent='AI zoekt locatie...';
  try{
    var r=await fetch(CAPI,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:80,
        messages:[{role:'user',content:'Venue: "'+venue+'". Reply ONLY JSON: {"plaats":"Amsterdam"}. Dutch city name. Unknown: {"plaats":""}.' }]})});
    var d=await r.json(); var txt=(d.content&&d.content[0]&&d.content[0].text)||'';
    var m=txt.match(/\{[^}]+\}/);
    if(m){ var loc=JSON.parse(m[0]); if(loc.plaats&&pEl&&!pEl.value.trim()){ pEl.value=loc.plaats; if(hint) hint.textContent='AI: '+loc.plaats; setTimeout(function(){ if(hint) hint.textContent=''; },3000); } }
  } catch(e){ if(hint) hint.textContent=''; }
}

function addSong(){ var el=document.getElementById('newSong'); if(el&&el.value.trim()){ syncFDFromForm(); FD.setlist.push(el.value.trim()); el.value=''; refreshSongArea(); } }
function rmSong(i){ syncFDFromForm(); FD.setlist.splice(i,1); refreshSongArea(); }

function parseAndAddPaste(){
  var ta=document.getElementById('pasteArea'); if(!ta||!ta.value.trim()){ toast('Geen tekst','err'); return; }
  syncFDFromForm(); var added=0;
  ta.value.split('\n').forEach(function(line){
    line=line.trim(); if(!line) return;
    // Herken encore-scheidingstekens
    if(/^[-=*]{2,}$/.test(line) || /^encore\b/i.test(line) || /^e:/i.test(line)){
      if(FD.setlist.length && FD.setlist[FD.setlist.length-1]!=='---'){ FD.setlist.push('---'); }
      return;
    }
    // Strip nummering vooraan
    var cleaned=line.replace(/^[\d]+[\s]*[\.\-\)][\s]*/,'').trim();
    // Verwijder Setlist.fm artefacten
    if(/^play video$/i.test(cleaned)) return;
    // Regel die alleen haakjes-tekst is → plak aan vorig nummer
    if(/^\(.*\)$/.test(cleaned)){
      if(FD.setlist.length && FD.setlist[FD.setlist.length-1]!=='---'){
        FD.setlist[FD.setlist.length-1] += ' ' + cleaned;
      }
      return;
    }
    if(cleaned){ FD.setlist.push(cleaned); added++; }
  });
  ta.value=''; refreshSongArea(); toast(added+' nummers toegevoegd!','ok');
}

function refreshSongArea(){
  var songs=FD.setlist;
  var container=document.querySelector('.fcard .song-chips');
  var sfSt=document.getElementById('sfSt');
  var wrapper=document.createElement('div');
  wrapper.className='song-chips';
  wrapper.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px';
  if(!songs.length){
    if(container) container.remove();
    return;
  }
  var num=0;
  songs.forEach(function(s,i){
    var chip=document.createElement('div');
    chip.className='schip';
    chip.draggable=true;
    chip.dataset.idx=String(i);
    if(s==='---'){
      chip.style.cssText='width:100%;display:flex;align-items:center;gap:6px;margin:2px 0';
      chip.innerHTML='<div style="flex:1;height:1px;background:var(--border)"></div>'
        +'<span style="font-size:10px;color:var(--muted);flex-shrink:0">ENCORE</span>'
        +'<div style="flex:1;height:1px;background:var(--border)"></div>'
        +'<button class="srem" onclick="rmSong('+i+')">&#215;</button>';
    } else {
      num++;
      chip.innerHTML='<span class="sdrag" title="Versleep om te herordenen">&#8597;</span>'
        +'<span class="snum">'+num+'</span>'
        +'<span>'+escH(s)+'</span>'
        +'<button class="srem" onclick="rmSong('+i+')">&#215;</button>';
    }
    chip.addEventListener('dragstart',function(e){
      e.dataTransfer.setData('text/plain',String(i));
      chip.style.opacity='0.4';
    });
    chip.addEventListener('dragend',function(){
      chip.style.opacity='';
      wrapper.querySelectorAll('.schip').forEach(function(c){c.classList.remove('drag-over');});
    });
    chip.addEventListener('dragover',function(e){ e.preventDefault(); chip.classList.add('drag-over'); });
    chip.addEventListener('dragleave',function(){ chip.classList.remove('drag-over'); });
    chip.addEventListener('drop',function(e){
      e.preventDefault();
      chip.classList.remove('drag-over');
      var from=parseInt(e.dataTransfer.getData('text/plain'));
      var to=parseInt(chip.dataset.idx);
      if(isNaN(from)||isNaN(to)||from===to) return;
      syncFDFromForm();
      var moved=FD.setlist.splice(from,1)[0];
      FD.setlist.splice(to,0,moved);
      refreshSongArea();
    });
    wrapper.appendChild(chip);
  });
  if(container){ container.replaceWith(wrapper); }
  else if(sfSt){ sfSt.insertAdjacentElement('afterend',wrapper); }
}

  return '<h1>ANALYTICS</h1>'

function yApplyFilter(){
  var active=[];
  document.querySelectorAll('#yfilters .ybtn-on').forEach(function(b){active.push(b.dataset.s);});
  document.querySelectorAll('#yrBars .yseg').forEach(function(s){s.style.display=active.indexOf(s.dataset.s)>-1?'':'none';});
  var totals=[];
  document.querySelectorAll('#yrBars .ycol').forEach(function(col){
    var tot=0,visSegs=[];
    col.querySelectorAll('.yseg').forEach(function(s){
      if(s.style.display!=='none'){var m=(s.getAttribute('title')||'').match(/: (\d+)$/);var n=m?parseInt(m[1]):0;tot+=n;visSegs.push({el:s,n:n});}
    });
    totals.push(tot);
    var cnt=col.querySelector('.ycnt'); if(cnt) cnt.textContent=tot||'';
    visSegs.forEach(function(seg){seg.el.style.height=tot?Math.round(seg.n/tot*100)+'%':'0%';});
  });
  var maxTot=Math.max.apply(null,totals.concat([1]));
  document.querySelectorAll('#yrBars .ycol').forEach(function(col,i){
    var ybar=col.querySelector('.ybar'); if(!ybar)return;
    ybar.style.height=(totals[i]?Math.round(totals[i]/maxTot*110)+6:4)+'px';
  });
}

function renderAliasSection(kind){
  var map = aliasesDB[kind] || {};
  var canons = Object.keys(map).sort();
  var availableValues = [...new Set(DB.map(function(c){ return kind==='artiest'?c.artiest:c.locatie; }).filter(Boolean))].sort();
  var html = '';
  canons.forEach(function(canon){
    var aliases = map[canon] || [];
    html += '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">'
      +'<strong style="font-size:14px">'+escH(canon)+'</strong>'
      +'<button class="btn b-del b-sm" onclick="removeCanonical(\''+kind+'\',\''+escJS(canon)+'\')">&#215;</button>'
      +'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
    aliases.forEach(function(a){
      html += '<span style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px">'
        +escH(a)
        +'<button onclick="removeAlias(\''+kind+'\',\''+escJS(canon)+'\',\''+escJS(a)+'\')" style="background:none;border:none;color:var(--muted);cursor:pointer;padding:0;font-size:14px;line-height:1">&#215;</button>'
        +'</span>';
    });
    if(!aliases.length) html += '<span style="color:var(--muted);font-size:12px;font-style:italic">Nog geen aliassen</span>';
    html += '</div>'
      +'<div style="display:flex;gap:6px">'
      +'<select id="aliasAdd_'+kind+'_'+escH(canon).replace(/[^a-zA-Z0-9]/g,'_')+'" style="flex:1;min-width:0">'
      +'<option value="">+ Kies een alias om toe te voegen...</option>'
      +availableValues.filter(function(v){return v!==canon && aliases.indexOf(v)===-1;}).map(function(v){return '<option value="'+escH(v)+'">'+escH(v)+'</option>';}).join('')
      +'</select>'
      +'<button class="btn b-sec b-sm" onclick="addAliasFromSelect(\''+kind+'\',\''+escJS(canon)+'\')">Toevoegen</button>'
      +'</div>'
      +'</div>';
  });
  html += '<div style="background:var(--bg3);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;margin-top:8px">'
    +'<div class="clbl" style="margin-bottom:8px">+ Nieuwe canonieke naam</div>'
    +'<div style="display:flex;gap:6px">'
    +'<select id="newCanon_'+kind+'" style="flex:1;min-width:0">'
    +'<option value="">Kies...</option>'
    +availableValues.filter(function(v){return !(v in map);}).map(function(v){return '<option value="'+escH(v)+'">'+escH(v)+'</option>';}).join('')
    +'</select>'
    +'<button class="btn b-pri b-sm" onclick="addCanonical(\''+kind+'\')">+</button>'
    +'</div></div>';
  return html;
}

function escJS(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function addCanonical(kind){
  var sel = document.getElementById('newCanon_'+kind);
  if(!sel || !sel.value) return;
  if(!aliasesDB[kind]) aliasesDB[kind] = {};
  aliasesDB[kind][sel.value] = aliasesDB[kind][sel.value] || [];
  persistAliases();
  goPage('sync');
}

function removeCanonical(kind, canon){
  if(!confirm('Canonieke naam "'+canon+'" verwijderen? (aliassen worden ook losgekoppeld)')) return;
  if(aliasesDB[kind]) delete aliasesDB[kind][canon];
  persistAliases();
  goPage('sync');
}

function addAliasFromSelect(kind, canon){
  var id = 'aliasAdd_'+kind+'_'+canon.replace(/[^a-zA-Z0-9]/g,'_');
  var sel = document.getElementById(id);
  if(!sel || !sel.value) return;
  if(!aliasesDB[kind]) aliasesDB[kind] = {};
  if(!aliasesDB[kind][canon]) aliasesDB[kind][canon] = [];
  if(aliasesDB[kind][canon].indexOf(sel.value)===-1){
    aliasesDB[kind][canon].push(sel.value);
  }
  persistAliases();
  goPage('sync');
}

function removeAlias(kind, canon, alias){
  if(aliasesDB[kind] && aliasesDB[kind][canon]){
    aliasesDB[kind][canon] = aliasesDB[kind][canon].filter(function(x){return x!==alias;});
  }
  persistAliases();
  goPage('sync');
}

    +'</div>'

    +'<button class="btn b-pri" style="flex:1;justify-content:center" onclick="doExportXL()">&#11015; Exporteer Excel (.xlsx)</button>'
    +'<button class="btn b-sec" style="flex:1;justify-content:center" onclick="doExportCSV()">&#128196; Exporteer CSV</button>'
    +'</div>'
    +'<div class="cbox" style="font-size:13px;color:var(--muted)"><div class="clbl">Database</div>'

    +'<div class="danger-zone"><div class="danger-title">&#9888; Gevarenzone</div>'

function saveGistConfig(){
  var id=document.getElementById('gistIdIn'), tok=document.getElementById('gistTokIn');
  if(!id||!tok) return;
  GIST_ID=id.value.trim(); GIST_TOKEN=tok.value.trim();
  localStorage.setItem('giglog_gist_id',GIST_ID); localStorage.setItem('giglog_gist_token',GIST_TOKEN);
  toast('Gist instellingen opgeslagen','ok');
  if(GIST_ID) loadFromGist();
  goPage('sync');
}

function saveAnthropicKey(){
  var el=document.getElementById('anthropicKeyIn');
  if(!el)return;
  ANTHROPIC_KEY=el.value.trim();
  localStorage.setItem('giglog_anthropic_key',ANTHROPIC_KEY);
  toast(ANTHROPIC_KEY?'API key opgeslagen!':'API key verwijderd','ok');
  goPage('sync');
}
function clearGistConfig(){
  GIST_ID=''; GIST_TOKEN='';
  localStorage.removeItem('giglog_gist_id'); localStorage.removeItem('giglog_gist_token');
  toast('Verbinding verwijderd','info'); goPage('sync');
}

function syncNow(){
  if(GIST_ID) loadFromGist();
  if(GIST_ID&&GIST_TOKEN) saveToGist();
}

// ── READ-ONLY GENERATOR ───────────────────────────────────────────
// roMain draait alleen in readonly.html (toString wordt in de download gezet).
function roMain(GID){
  var GF = 'concertlog.json';
  var DB = [], TOP = {}, TM = {}, pg = 0;
  var Q = '', FJ = '', FS = '', FP = '', FL = '', CP = 1, PP = 50;
  var SO = ['Hoofdprogramma','Voorprogramma','Festivaloptreden','Theater/Comedy'];
  var TN = {hp:'Hoofdprogramma / Voorprogramma', fest:'Festivaloptredens'};
  function $(id){ return document.getElementById(id); }
  function eh(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fm(q,t){
    if(!q) return true; if(!t) return false;
    var tl=t.toLowerCase(), ql=q.toLowerCase().trim();
    if(tl.includes(ql)) return true;
    return ql.split(/\s+/).filter(Boolean).every(function(w){ return tl.includes(w); });
  }
  function nrs(c){ return (c.setlist||[]).filter(function(x){ return x!=='---'; }).length; }
  function badge(id){
    var t = TM[id]; if(!t) return '';
    return ' <span class="pill pt">#'+t.p+' Top '+(t.k==='fest'?'festivals ':'')+t.y+'</span>';
  }
  function buildTM(){
    TM = {};
    Object.keys(TOP).forEach(function(y){
      ['hp','fest'].forEach(function(k){
        ((TOP[y] && TOP[y][k]) || []).forEach(function(id,i){ TM[id] = {y:y,k:k,p:i+1}; });
      });
    });
  }
  function gp(p){
    pg = p;
    ['tl','tt','ta'].forEach(function(id,i){ var e=$(id); if(e) e.className='ntab'+(i===p?' on':''); });
    re();
  }
  function re(){
    $('A').innerHTML = pg===0 ? bL() : pg===1 ? bT() : bA();
    if(pg===0) bindList();
  }
  function gf(){
    return DB.filter(function(c){
      var q=Q.trim(), lq=FL.trim();
      return (!q||[c.artiest,c.locatie,c.plaats,c.festival,c.soort].some(function(v){ return fm(q,v); }))
        && (!lq||fm(lq,c.locatie)) && (!FJ||String(c.jaar)===FJ) && (!FS||c.soort===FS) && (!FP||c.plaats===FP);
    }).sort(function(a,b){ return b.datum>a.datum?1:-1; });
  }
  function bL(){
    var jr=[...new Set(DB.map(function(c){return c.jaar;}).filter(Boolean))].sort(function(a,b){return b-a;});
    var pl=[...new Set(DB.map(function(c){return c.plaats;}).filter(Boolean))].sort();
    return '<h1>CONCERTLOG <span style="font-size:14px;color:#777" id="tc"></span></h1>'
      +'<div class="sw"><div class="si" style="flex:1;min-width:160px"><span class="ic">&#128269;</span><input id="si" placeholder="Zoek artiest, locatie, plaats..." value="'+eh(Q)+'"></div>'
      +'<div class="si" style="min-width:100px"><span class="ic">&#128205;</span><input id="li" placeholder="Venue..." value="'+eh(FL)+'"></div>'
      +'<select id="js" style="width:auto;min-width:80px"><option value="">Alle jaren</option>'+jr.map(function(j){return '<option value="'+j+'"'+(FJ===String(j)?' selected':'')+'>'+j+'</option>';}).join('')+'</select>'
      +'<select id="ss" style="width:auto;min-width:110px"><option value="">Alle soorten</option>'+SO.map(function(s){return '<option value="'+s+'"'+(FS===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'
      +'<select id="ps" style="width:auto;min-width:100px"><option value="">Alle plaatsen</option>'+pl.map(function(p){return '<option value="'+eh(p)+'"'+(FP===p?' selected':'')+'>'+eh(p)+'</option>';}).join('')+'</select></div>'
      +'<div id="ri" style="font-size:12px;color:#777;margin-bottom:8px"></div><div id="cg" class="grid"></div><div id="pd" class="pag"></div>';
  }
  function bindList(){
    $('si').addEventListener('input',function(){ Q=this.value; CP=1; uc(); });
    $('li').addEventListener('input',function(){ FL=this.value; CP=1; uc(); });
    $('js').addEventListener('change',function(){ FJ=this.value; CP=1; uc(); });
    $('ss').addEventListener('change',function(){ FS=this.value; CP=1; uc(); });
    $('ps').addEventListener('change',function(){ FP=this.value; CP=1; uc(); });
    uc();
  }
  function uc(){
    var f=gf(), tot=f.length, pages=Math.max(1,Math.ceil(tot/PP));
    if(CP>pages) CP=pages;
    var sl=f.slice((CP-1)*PP,CP*PP);
    $('tc').textContent = tot.toLocaleString('nl')+' concerten';
    $('ri').textContent = tot+' resultaten \u00b7 pagina '+CP+' van '+pages;
    $('cg').innerHTML = tot===0 ? '<div style="text-align:center;padding:48px;color:#777">Geen resultaten</div>' : sl.map(bc).join('');
    $('pd').innerHTML = pages>1
      ? '<button class="btn"'+(CP===1?' disabled':'')+' onclick="pn(-1)">&larr;</button> <span class="pi">'+CP+' / '+pages+'</span> <button class="btn"'+(CP===pages?' disabled':'')+' onclick="pn(1)">&rarr;</button>'
      : '';
  }
  function pn(d){ CP=Math.max(1,CP+d); uc(); window.scrollTo(0,0); }
  function bc(c){
    var d=c.datum?new Date(c.datum).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}):'';
    var n=nrs(c);
    return '<div class="card" onclick="od(\''+eh(c.id)+'\')">'
      +'<div class="ctop"><div class="ca">'+eh(c.artiest)+'</div><div class="cd">'+d+'</div></div>'
      +'<div class="cm">'
      +(c.locatie?'&#128205; '+eh(c.locatie)+(c.plaats?', '+eh(c.plaats):' '):(c.plaats?'&#128205; '+eh(c.plaats):''))
      +(c.soort?' <span class="pill ps">'+eh(c.soort)+'</span>':'')
      +(c.festival?' <span class="pill pf">&#127991; '+eh(c.festival)+'</span>':'')
      +(n?' <span class="pill pl">&#127925; '+n+' nrs</span>':'')
      +badge(c.id)
      +'</div></div>';
  }
  function od(id){
    var c=DB.find(function(x){ return x.id===id; }); if(!c) return;
    var d=c.datum?new Date(c.datum).toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'}):'';
    var s=c.setlist||[], num=0;
    var sh = s.length
      ? '<div style="font-size:11px;color:#777;text-transform:uppercase;margin-bottom:10px">Setlist &mdash; '+nrs(c)+' nummers</div>'
        + s.map(function(t){
            if(t==='---') return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0"><div style="flex:1;height:1px;background:rgba(255,255,255,.08)"></div><span style="font-size:10px;font-weight:600;color:#777">ENCORE</span><div style="flex:1;height:1px;background:rgba(255,255,255,.08)"></div></div>';
            num++;
            return '<div class="sli"><span class="sln">'+num+'</span><span class="slt">'+eh(t)+'</span></div>';
          }).join('')
      : '<div style="padding:30px;text-align:center;color:#777">Geen setlist</div>';
    var meta = eh(d)+(c.locatie?' &middot; &#128205; '+eh(c.locatie)+(c.plaats?', '+eh(c.plaats):''):(c.plaats?' &middot; &#128205; '+eh(c.plaats):''))
      +(c.soort?' <span class="pill ps">'+eh(c.soort)+'</span>':'')+badge(c.id);
    var ov=document.createElement('div'); ov.className='mo'; ov.id='dm';
    ov.innerHTML='<div class="md"><div class="mh"><div style="min-width:0"><div class="mt">'+eh(c.artiest)+'</div><div class="mm">'+meta+'</div></div>'
      +'<button class="mc" onclick="cd()">&#215;</button></div><div class="mb">'+sh+'</div></div>';
    ov.addEventListener('click',function(e){ if(e.target===ov) cd(); });
    document.body.appendChild(ov); document.body.style.overflow='hidden';
  }
  function cd(){ var m=$('dm'); if(m){ m.remove(); document.body.style.overflow=''; } }
  function bT(){
    var ys=Object.keys(TOP).sort(function(a,b){ return b-a; });
    var h='<h1>TOP CONCERTEN</h1>';
    if(!ys.length) return h+'<p style="padding:40px;text-align:center;color:#777">Nog geen top-lijsten</p>';
    ys.forEach(function(y){
      h+='<div class="cb"><div style="font-family:Bebas Neue,sans-serif;font-size:28px">'+eh(y)+'</div>';
      ['hp','fest'].forEach(function(k){
        var ids=(TOP[y]&&TOP[y][k])||[];
        h+='<div class="cl" style="margin-top:14px">'+TN[k]+' ('+ids.length+')</div>';
        if(!ids.length) h+='<div style="color:#777;font-size:13px">Nog geen concerten in deze lijst.</div>';
        ids.forEach(function(id,i){
          var c=DB.find(function(x){ return x.id===id; });
          var d=(c&&c.datum)?new Date(c.datum).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}):'';
          var loc=c?(c.locatie?eh(c.locatie)+(c.plaats?', '+eh(c.plaats):''):eh(c.plaats||'')):'';
          h+='<div class="tr"><div class="tp">'+(i+1)+'</div>'
            +(c?'<div style="flex:1;min-width:0;cursor:pointer" onclick="od(\''+eh(id)+'\')"><div class="ta2">'+eh(c.artiest)+'</div><div style="font-size:12px;color:#777">'+eh(d)+(loc?' &middot; '+loc:'')+'</div></div>'
               :'<div style="flex:1;color:#777;font-style:italic">Concert niet gevonden</div>')
            +'</div>';
        });
      });
      h+='</div>';
    });
    return h;
  }
  function bA(){
    if(!DB.length) return '<p style="padding:40px;text-align:center;color:#777">Geen data</p>';
    var tot=DB.length, uA=new Set(DB.map(function(c){return c.artiest;})).size, uP=new Set(DB.map(function(c){return c.plaats;}).filter(Boolean)).size;
    function st(v,l,s){ return '<div class="stat"><div class="stl">'+l+'</div><div class="stv">'+v+'</div><div class="sts">'+s+'</div></div>'; }
    var ac={}; DB.forEach(function(c){ ac[c.artiest]=(ac[c.artiest]||0)+1; });
    var t10=Object.entries(ac).sort(function(a,b){return b[1]-a[1];}).slice(0,10), mA=t10[0]?t10[0][1]:1;
    var yc={}; DB.forEach(function(c){ if(c.jaar) yc[c.jaar]=(yc[c.jaar]||0)+1; });
    var yrs=Object.entries(yc).sort(function(a,b){return +a[0]-+b[0];}), mY=yrs.length?Math.max.apply(null,yrs.map(function(y){return y[1];})):1;
    var pc={}; DB.forEach(function(c){ if(c.plaats) pc[c.plaats]=(pc[c.plaats]||0)+1; });
    var tP=Object.entries(pc).sort(function(a,b){return b[1]-a[1];}).slice(0,8), mP=tP[0]?tP[0][1]:1;
    function bar(e,m){ return e.map(function(x){ return '<div class="br"><div class="bn">'+eh(x[0])+'</div><div class="bt"><div class="bf" style="width:'+Math.round(x[1]/m*100)+'%"></div></div><div class="bc">'+x[1]+'</div></div>'; }).join(''); }
    return '<h1>ANALYTICS</h1><div class="sg">'+st(tot.toLocaleString('nl'),'Totaal','concerten')+st(uA,'Artiesten','uniek')+st(uP,'Plaatsen','bezocht')+st((tot/uA).toFixed(1)+'&times;','Loyalty','gem. per artiest')+st(Math.round(uA/tot*100)+'%','Diversity','unieke artiesten')+'</div>'
      +'<div class="cb"><div class="cl">Top 10 artiesten</div>'+bar(t10,mA)+'</div>'
      +'<div class="cb"><div class="cl">Concerten per jaar</div><div class="ybars">'+yrs.map(function(e){ var h=Math.round(e[1]/mY*72)+4; return '<div class="ycol"><div class="ycnt">'+e[1]+'</div><div class="ybar" style="height:'+h+'px"></div><div class="ylbl">\''+String(e[0]).slice(2)+'</div></div>'; }).join('')+'</div></div>'
      +'<div class="cb"><div class="cl">Top plaatsen</div>'+bar(tP,mP)+'</div>';
  }
  async function init(){
    if(!GID){ $('A').innerHTML='<p style="padding:40px;text-align:center;color:#777">Geen Gist ID geconfigureerd.</p>'; return; }
    try{
      var r=await fetch('https://api.github.com/gists/'+GID,{headers:{'Accept':'application/vnd.github+json'}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      var g=await r.json(), f=g.files&&g.files[GF];
      if(!f) throw new Error('Bestand niet gevonden');
      DB=JSON.parse(f.content).map(function(c){
        if(c.soort==='Theater'||c.soort==='Musical'||c.soort==='Comedy') c.soort='Theater/Comedy';
        return c;
      });
      var tf=g.files&&g.files['top.json'];
      if(tf){ try{ TOP=JSON.parse(tf.content)||{}; }catch(x){ TOP={}; } }
      buildTM();
      re();
    }catch(e){
      $('A').innerHTML='<p style="padding:40px;text-align:center;color:#ff4d6d">Laden mislukt: '+eh(e.message)+'</p>';
    }
  }
  window.gp=gp; window.od=od; window.cd=cd; window.pn=pn;
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') cd(); });
  init();
}

  var a=document.createElement('a');

  a.download='readonly.html'; a.click();
  toast('readonly.html gedownload!','ok');
}

  // 42
  var eenmalig=Object.values(artYears).filter(function(v){return v.size===1;}).length;
  var uArt3=Object.keys(artYears).length;F.push('&#128279; <strong>'+eenmalig+' artiesten</strong> ('+Math.round(eenmalig/uArt3*100)+'%) zag je maar 1 keer');
  // 43
  var festC={};DB.forEach(function(c){if(c.festival)festC[c.festival]=(festC[c.festival]||0)+1;});
  var topFest=Object.entries(festC).sort(function(a,b){return b[1]-a[1];})[0];
  if(topFest)F.push('&#127914; Meest bezochte festival: <strong>'+escH(topFest[0])+'</strong> (<strong>'+topFest[1]+' optredens</strong>)');
  // 44
  var artTotalSongs={};DB.forEach(function(c){if(c.artiest&&c.setlist)artTotalSongs[c.artiest]=(artTotalSongs[c.artiest]||0)+c.setlist.filter(function(x){return x!=='---';}).length;});
  var topTSongs=Object.entries(artTotalSongs).sort(function(a,b){return b[1]-a[1];})[0];
  if(topTSongs)F.push('&#127925; <strong>'+escH(topTSongs[0])+'</strong> speelde de meeste nummers voor jou: <strong>'+topTSongs[1]+'</strong>');
  // 45
  if(sorted.length)F.push('&#128336; Je houdt je concertgeschiedenis al <strong>'+span+' jaar</strong> bij (sinds '+sorted[0].datum.slice(0,4)+')');
  // 46
  var locFirst={};sorted.forEach(function(c){if(c.locatie&&!locFirst[c.locatie])locFirst[c.locatie]=c.datum;});
  var newestLoc=Object.entries(locFirst).sort(function(a,b){return b[1]>a[1]?1:-1;})[0];
  if(newestLoc)F.push('&#127381; Nieuwste locatie: <strong>'+escH(newestLoc[0])+'</strong> (eerste bezoek: '+fmt(newestLoc[1])+')');
  // 47
  var locSort=Object.entries(lc).sort(function(a,b){return b[1]-a[1];});
  if(locSort.length>=3){var top3sum=locSort[0][1]+locSort[1][1]+locSort[2][1];F.push('&#127351; Top 3 locaties zijn goed voor <strong>'+Math.round(top3sum/DB.length*100)+'%</strong> van alle concerten');}
  // 48
  var kdC=DB.filter(function(c){return c.datum&&c.datum.slice(5)==='04-27';}).length;
  if(kdC>0)F.push('&#127481;&#127475; <strong>'+kdC+'&times;</strong> concert op Koningsdag (27 april)');
  // 49
  var byDOY={};sorted.forEach(function(c){if(c.datum){var doy=c.datum.slice(5);if(!byDOY[doy])byDOY[doy]=[];byDOY[doy].push(c);}});
  var earliestDOY=Object.keys(byDOY).sort()[0];
  if(earliestDOY){var ec=byDOY[earliestDOY][0];F.push('&#127976; Vroegste concert in het jaar: <strong>'+earliestDOY+'</strong> &mdash; <strong>'+escH(ec.artiest)+'</strong>');}
  // 50
  var zomer2=DB.filter(function(c){return c.maand&&c.maand>=6&&c.maand<=8;});
  if(zomer2.length){var topZomer={};zomer2.forEach(function(c){topZomer[c.artiest]=(topZomer[c.artiest]||0)+1;});var tzTop=Object.entries(topZomer).sort(function(a,b){return b[1]-a[1];})[0];if(tzTop)F.push('&#9728; Meest geziene artiest in de zomer: <strong>'+escH(tzTop[0])+'</strong> ('+tzTop[1]+' zomerconcerten)');}

  // Shuffle
  for(var si=F.length-1;si>0;si--){var sj=Math.floor(Math.random()*(si+1));var st3=F[si];F[si]=F[sj];F[sj]=st3;}
  return F;
}

function showFact(idx){
  var facts=window._allFacts;if(!facts||!facts.length)return;
  _factIdx=((idx%facts.length)+facts.length)%facts.length;
  var el=document.getElementById('factDisplay');
  var counter=document.getElementById('factCounter');
  if(el){el.style.opacity='0';setTimeout(function(){el.innerHTML=facts[_factIdx];el.style.opacity='1';},150);}
  if(counter)counter.textContent=(_factIdx+1)+' / '+facts.length;
}
function nextFact(){showFact(_factIdx+1);}
function prevFact(){showFact(_factIdx-1);}
function randomFact(){showFact(Math.floor(Math.random()*(window._allFacts||[]).length));}

function chatAsk(question){var input=document.getElementById('chatInput');if(input){input.value=question;}chatSend();}

var chatHistory=[];

async function chatSend(){
  var input=document.getElementById('chatInput');
  var btn=document.getElementById('chatSend');
  var msgs=document.getElementById('chatMsgs');
  if(!input||!msgs)return;
  var q=input.value.trim();if(!q)return;
  chatAddMsg('user',q);input.value='';if(btn)btn.disabled=true;
  var thinkId='think_'+Date.now();
  msgs.insertAdjacentHTML('beforeend','<div class="chat-msg thinking" id="'+thinkId+'"><div class="chat-avatar chat-bot-avatar">&#129302;</div><div class="chat-bubble"><span class="spin"></span> Denkt na...</div></div>');
  msgs.scrollTop=msgs.scrollHeight;
  chatHistory.push({role:'user',content:q});
  if(chatHistory.length>12)chatHistory=chatHistory.slice(-12);
  if(!ANTHROPIC_KEY){var t2=document.getElementById(thinkId);if(t2)t2.remove();chatAddMsg('bot','Voer eerst een Anthropic API key in bij Admin.');if(btn)btn.disabled=false;return;}
  var summary=buildDataSummary();
  var systemPrompt='Je bent een data-analist die vragen beantwoordt over de concertgeschiedenis van Gijs. Antwoord altijd in het Nederlands, bondig en concreet. Gebruik geen markdown headers.\n\n'+summary;
  try{
    var r=await fetch(CAPI,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:systemPrompt,messages:chatHistory})});
    var data=await r.json();
    if(data.error){var t3=document.getElementById(thinkId);if(t3)t3.remove();chatAddMsg('bot','API fout: '+(data.error.message||JSON.stringify(data.error)));if(btn)btn.disabled=false;return;}
    var reply=(data.content&&data.content[0]&&data.content[0].text)||('Onverwachte respons: '+JSON.stringify(data).slice(0,150));
    var t4=document.getElementById(thinkId);if(t4)t4.remove();
    chatAddMsg('bot',reply);
    chatHistory.push({role:'assistant',content:reply});
    if(chatHistory.length>12)chatHistory=chatHistory.slice(-12);
  }catch(e){var t5=document.getElementById(thinkId);if(t5)t5.remove();chatAddMsg('bot','Fout: '+e.message);}
  if(btn)btn.disabled=false;
}

function chatAddMsg(role,text){
  var msgs=document.getElementById('chatMsgs');if(!msgs)return;
  var isUser=role==='user';
  var avatar=isUser?'<div class="chat-avatar chat-user-avatar">&#128100;</div>':'<div class="chat-avatar chat-bot-avatar">&#129302;</div>';
  var bubble='<div class="chat-bubble">'+escH(text).replace(/\n/g,'<br>')+'</div>';
  msgs.insertAdjacentHTML('beforeend','<div class="chat-msg '+role+'">'+(isUser?bubble+avatar:avatar+bubble)+'</div>');
  msgs.scrollTop=msgs.scrollHeight;
}

function buildDataSummary(){
  var lines=[];
  var dated=DB.filter(function(c){return c.datum;}).sort(function(a,b){return a.datum>b.datum?1:-1;});
  var firstYear=dated.length?dated[0].datum.slice(0,4):'?';
  var lastYear=dated.length?dated[dated.length-1].datum.slice(0,4):'?';
  lines.push('TOTAAL: '+DB.length+' concerten van '+firstYear+' t/m '+lastYear);
  var ac={};DB.forEach(function(c){var k=canonical('artiest',c.artiest);ac[k]=(ac[k]||0)+1;});
  lines.push('\nTOP ARTIESTEN:');Object.entries(ac).sort(function(a,b){return b[1]-a[1];}).slice(0,30).forEach(function(e){lines.push('  '+e[0]+': '+e[1]);});
  var lc={};DB.forEach(function(c){if(c.locatie){var k=canonical('locatie',c.locatie);lc[k]=(lc[k]||0)+1;}});
  lines.push('\nTOP LOCATIES:');Object.entries(lc).sort(function(a,b){return b[1]-a[1];}).slice(0,30).forEach(function(e){lines.push('  '+e[0]+': '+e[1]);});
  var yc={};DB.forEach(function(c){if(c.jaar)yc[c.jaar]=(yc[c.jaar]||0)+1;});
  lines.push('\nPER JAAR:');Object.entries(yc).sort(function(a,b){return+a[0]-+b[0];}).forEach(function(e){lines.push('  '+e[0]+': '+e[1]);});
  lines.push('\nVOLLEDIGE LIJST (datum|artiest|locatie|plaats):');
  dated.forEach(function(c){lines.push(c.datum+'|'+c.artiest+'|'+(c.locatie||'')+'|'+(c.plaats||''));});
  var result=lines.join('\n');
  if(result.length>80000)result=result.slice(0,80000)+'\n[...ingekort]';
  return result;
}

function doExportXL(){
  if(!DB.length){ toast('Geen data','err'); return; }
  var rows=DB.map(function(c){ return {'Artiest':c.artiest,'Locatie':c.locatie,'Plaats':c.plaats,'Datum':c.datum,'Setlist':(c.setlist||[]).join('\n'),'Zaal/andere bijz.':c.festival,'Soort optreden':c.soort,'Maand':c.maand,'Jaar':c.jaar}; });
  var ws=XLSX.utils.json_to_sheet(rows); var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Concerten');
  XLSX.writeFile(wb,'concertlog_'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Excel gedownload!','ok');
}

function doExportCSV(){
  if(!DB.length){ toast('Geen data','err'); return; }
  var hdr=['Artiest','Locatie','Plaats','Datum','Setlist','Festival/andere bijz.','Soort optreden','Maand','Jaar'];
  var rows=DB.map(function(c){ return [c.artiest,c.locatie,c.plaats,c.datum,(c.setlist||[]).join(' | '),c.festival,c.soort,c.maand,c.jaar].map(function(v){ return '"'+String(v||'').replace(/"/g,'""')+'"'; }); });
  var csv=[hdr.join(',')].concat(rows.map(function(r){ return r.join(','); })).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='concertlog_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  toast('CSV gedownload!','ok');
}

function doImport(input){
  var file=input.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var data=XLSX.utils.sheet_to_json(ws,{defval:''});
      var added=0;
      data.forEach(function(row){
        var art=row['Artiest']||row['artiest']||''; if(!art) return;
        var d=row['Datum ']||row['Datum']||row['datum']||''; var ds='';
        if(d){ var dt=new Date(d); if(!isNaN(dt)) ds=dt.toISOString().slice(0,10); else ds=String(d).slice(0,10); }
        var sl=row['Setlist']||'';
        var songs=sl?String(sl).split(/[\n|]/).map(function(s){ return s.trim(); }).filter(Boolean):[];
        DB.push({id:String(Date.now()+added),artiest:String(art),
          locatie:String(row['Locatie']||row['locatie']||''),
          plaats:String(row['Plaats']||row['plaats']||''),
          datum:ds,setlist:songs,
          festival:String(row['Festival/andere bijz.']||row['Zaal/andere bijz.']||row['festival']||''),
          soort:String(row['Soort optreden']||row['soort']||'Hoofdprogramma'),
          maand:ds?parseInt(ds.slice(5,7)):0,jaar:ds?parseInt(ds.slice(0,4)):0});
        added++;
      });
      afterMutate(); toast(added+' concerten geimporteerd!','ok'); goPage('list');
    } catch(err){ toast('Import fout: '+err.message,'err'); }
  };
  r.readAsArrayBuffer(file);
}

function deleteAllConcerts(){
  if(!confirm('Weet je zeker dat je ALLE '+DB.length+' concerten wilt verwijderen?\n\nDit kan niet ongedaan worden gemaakt.')) return;
  if(!confirm('Laatste waarschuwing: '+DB.length+' concerten worden permanent verwijderd.')) return;
  DB=[]; afterMutate(); toast('Alle concerten verwijderd','err'); goPage('sync');
}

// ── UPCOMING ────────────────────────────────────────────────────────
function buildUpcoming(){
  var items = upcomingDB.slice().sort(function(a,b){ return a.datum > b.datum ? 1 : (a.datum < b.datum ? -1 : 0); });
  var today = new Date(); today.setHours(0,0,0,0);

  var listHtml = items.length === 0
    ? '<div style="text-align:center;padding:48px;color:var(--muted)">Geen aankomende concerten. Voeg er een toe!</div>'
    : items.map(function(item, i){
        var d = null;
        if(item.datum){
          var dp = item.datum.split('-');
          d = new Date(parseInt(dp[0]), parseInt(dp[1])-1, parseInt(dp[2]));
        }
        var isPast = d && d < today;
        var dStr = d ? d.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"short",year:"numeric"}) : "";
        var daysLeft = d ? Math.round((d - today) / 86400000) : null;
        var badge = "";
        if(daysLeft !== null){
          if(daysLeft < 0)      badge = "<span style=\"font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,77,109,0.12);color:#ff4d6d\">Geweest</span>";
          else if(daysLeft===0) badge = "<span style=\"font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(253,195,0,0.15);color:var(--accent)\">Vandaag!</span>";
          else if(daysLeft<=7)  badge = "<span style=\"font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(253,195,0,0.12);color:var(--accent)\">Over "+daysLeft+" dag"+(daysLeft===1?"":"en")+"</span>";
        }
        return "<div style=\"display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)"+(isPast?";opacity:0.45":"")+";\">"
          + "<div style=\"flex:1;min-width:0;\">"
          + "<div style=\"font-family:\'Bebas Neue\',sans-serif;font-size:19px;color:var(--text);line-height:1.1\">"+escH(item.artiest)+"</div>"
          + "<div style=\"font-size:12px;color:var(--muted);margin-top:2px\">"
          + (dStr ? "&#128197; "+dStr : "")
          + (item.locatie ? " &nbsp;·&nbsp; &#128205; "+escH(item.locatie)+(item.plaats?", "+escH(item.plaats):"") : "")
          + (item.notitie ? "<br><span style=\"color:var(--muted)\">"+escH(item.notitie)+"</span>" : "")
          + "</div></div>"
          + badge
          + (unlocked
            ? "<button onclick=\"delUpcoming('"+item.id+"')\" style=\"background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px;flex-shrink:0\" title=\"Verwijderen\">&#10005;</button>"
            : "")
          + "</div>";
      }).join("");

  var formHtml = unlocked ? (
    "<div class=\"cbox\" style=\"margin-top:16px\">"
    + "<div class=\"clbl\">Toevoegen</div>"
    + "<div class=\"fgrid\" style=\"margin-bottom:10px\">"
    + "<div class=\"fg\"><label>Artiest *</label><input id=\"upArtiest\" placeholder=\"Bijv. The Beths\"></div>"
    + "<div class=\"fg\"><label>Datum</label><input type=\"date\" id=\"upDatum\"></div>"
    + "<div class=\"fg\"><label>Locatie</label><input id=\"upLocatie\" placeholder=\"Bijv. Paradiso\"></div>"
    + "<div class=\"fg\"><label>Plaats</label><input id=\"upPlaats\" placeholder=\"Bijv. Amsterdam\"></div>"
    + "<div class=\"fg\" style=\"grid-column:1/-1\"><label>Notitie</label><input id=\"upNotitie\" placeholder=\"Bijv. met vrienden, zaal 2...\"></div>"
    + "</div>"
    + "<button class=\"btn b-pri\" onclick=\"addUpcoming()\">+ Toevoegen</button>"
    + "</div>"
  ) : "";

  return "<h1>AGENDA</h1>"
    + "<div class=\"cbox\">" + listHtml + "</div>"
    + formHtml;
}

function addUpcoming(){
  var a = document.getElementById("upArtiest");
  if(!a || !a.value.trim()){ toast("Artiest is verplicht","err"); return; }
  var item = {
    id: String(Date.now()),
    artiest: a.value.trim(),
    datum:   (document.getElementById("upDatum")   ||{value:""}).value,
    locatie: (document.getElementById("upLocatie") ||{value:""}).value.trim(),
    plaats:  (document.getElementById("upPlaats")  ||{value:""}).value.trim(),
    notitie: (document.getElementById("upNotitie") ||{value:""}).value.trim()
  };
  upcomingDB.push(item);
  persistUpcoming();
  render();
  toast("Toegevoegd!","ok");
}

function delUpcoming(id){
  if(!confirm("Verwijderen?")) return;
  upcomingDB = upcomingDB.filter(function(x){ return x.id !== id; });
  persistUpcoming();
  render();
  toast("Verwijderd","info");
}
